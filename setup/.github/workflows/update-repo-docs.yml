name: update-repo-docs

on:
  workflow_dispatch:
  schedule:
    - cron: '5 4 * * *'
  push:
    branches:
      - main
      
jobs:
  update-repo-docs:
    permissions:
      contents: write
      pull-requests: write
    # setup-github.sh replaces this placeholder with the current fortify/shared-github SHA.
    uses: fortify/shared-github/.github/workflows/reusable-update-repo-docs.yml@<shared-github-sha>