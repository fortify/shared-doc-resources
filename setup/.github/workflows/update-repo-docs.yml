name: update-repo-docs

on:
  workflow_dispatch:
  schedule:
    - cron: '5 4 * * *'
  push:
    branches:
      - main
      
jobs:
  update-repo-docs:
    permissions:
      contents: write
      pull-requests: write
    # TODO: replace <shared-github-sha> with the actual commit SHA once
    # reusable-update-repo-docs.yml is committed/pushed to fortify/shared-github.
    uses: fortify/shared-github/.github/workflows/reusable-update-repo-docs.yml@<shared-github-sha>